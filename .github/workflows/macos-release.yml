name: macOS release artifact verification

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: 'Existing commit or tag to build and verify (no release is published)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install release dependencies
        run: |
          npm ci
          npm --prefix core ci

      - name: Verify release distribution safeguards
        run: node --test src/api/releaseDistribution.test.js

      - name: Build and verify manual-approval DMG
        run: npm run package:mac
